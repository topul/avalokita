<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0906">
<title>观自在 · 一念通佛道，指尖悟修行</title>
<meta name="description" content="观自在 —— 佛道综合虚拟修行空间。礼佛三拜、上香供奉、敲击木鱼、持诵佛珠；朝礼三清、焚香告神、鸣磬诵经、掐诀持珠。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230a0806' stroke='%23d9b273'/%3E%3Cpath d='M16 6a10 10 0 0 1 0 20 5 5 0 0 1 0-10 5 5 0 0 0 0-10z' fill='%23d9b273'/%3E%3Ccircle cx='16' cy='11' r='2' fill='%230a0806'/%3E%3Ccircle cx='16' cy='21' r='2' fill='%23d9b273'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/buddha.css">
<link rel="stylesheet" href="styles/tao.css">
</head>
<body data-tradition="gate">

<div class="ambient" aria-hidden="true">
  <span class="mote"></span><span class="mote"></span><span class="mote"></span>
  <span class="mote"></span><span class="mote"></span><span class="mote"></span>
</div>

<!-- ══════════ 山门 · 宗教选择 ══════════ -->
<main class="gate" id="gate">
  <div class="gate-inner">
    <header class="gate-head">
      <p class="gate-eyebrow">虚 拟 修 行 · 静 心 之 所</p>
      <h1 class="gate-title">观自在</h1>
      <p class="gate-sub">一念通佛道，指尖悟修行。</p>
      <div class="gate-rule" aria-hidden="true"></div>
    </header>

    <div class="gate-doors">
      <button class="door door-b" data-enter="buddha" type="button">
        <span class="door-emblem" aria-hidden="true">
          <svg viewBox="0 0 200 200">
            <defs>
              <radialGradient id="gbGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0" stop-color="#ffe3ab" stop-opacity=".85"/>
                <stop offset=".55" stop-color="#e0ac53" stop-opacity=".22"/>
                <stop offset="1" stop-color="#e0ac53" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <circle cx="100" cy="100" r="96" fill="url(#gbGlow)"/>
            <circle cx="100" cy="100" r="62" fill="none" stroke="currentColor" stroke-opacity=".55" stroke-width="1.2"/>
            <circle cx="100" cy="100" r="74" fill="none" stroke="currentColor" stroke-opacity=".28" stroke-width="1" stroke-dasharray="2 7"/>
            <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-opacity=".9">
              <path d="M100 138c-24 0-41-8-49-20 14-7 33-4 49 8 16-12 35-15 49-8-8 12-25 20-49 20z"/>
              <path d="M100 128c-14 0-25-6-30-15 9-5 21-3 30 6 9-9 21-11 30-6-5 9-16 15-30 15z"/>
              <path d="M100 118V70"/>
              <circle cx="100" cy="62" r="9"/>
            </g>
          </svg>
        </span>
        <span class="door-name">佛门</span>
        <span class="door-tag">明心见性 · 慈悲喜舍</span>
        <span class="door-list">礼佛三拜 · 上香供奉<br>敲击木鱼 · 持诵佛珠</span>
        <span class="door-cta">入 &nbsp;殿</span>
      </button>

      <div class="gate-divider" aria-hidden="true">
        <span class="gd-line"></span>
        <span class="gd-word">佛</span>
        <span class="gd-dot"></span>
        <span class="gd-word">道</span>
        <span class="gd-line"></span>
      </div>

      <button class="door door-t" data-enter="tao" type="button">
        <span class="door-emblem" aria-hidden="true">
          <svg viewBox="0 0 200 200">
            <defs>
              <radialGradient id="gtGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0" stop-color="#bff0e4" stop-opacity=".7"/>
                <stop offset=".55" stop-color="#5fae9f" stop-opacity=".2"/>
                <stop offset="1" stop-color="#5fae9f" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <circle cx="100" cy="100" r="96" fill="url(#gtGlow)"/>
            <circle cx="100" cy="100" r="76" fill="none" stroke="currentColor" stroke-opacity=".3" stroke-width="1" stroke-dasharray="3 6"/>
            <g class="gt-spin">
              <circle cx="100" cy="100" r="56" fill="none" stroke="currentColor" stroke-opacity=".6" stroke-width="1.2"/>
              <path d="M100 44a56 56 0 0 1 0 112 28 28 0 0 1 0-56 28 28 0 0 0 0-56z" fill="currentColor" fill-opacity=".85"/>
              <circle cx="100" cy="72" r="7" fill="#06110f"/>
              <circle cx="100" cy="128" r="7" fill="currentColor"/>
            </g>
          </svg>
        </span>
        <span class="door-name">道门</span>
        <span class="door-tag">清静无为 · 抱朴守一</span>
        <span class="door-list">朝礼三清 · 焚香告神<br>鸣磬诵经 · 掐诀持珠</span>
        <span class="door-cta">入 &nbsp;殿</span>
      </button>
    </div>

    <footer class="gate-foot">
      <p class="gate-quote" id="gateQuote"></p>
      <p class="gate-note">本站为文化与心境体验之所，不代表任何宗教组织，亦不作宗教活动之用。</p>
    </footer>
  </div>
</main>

<!-- ══════════ 殿堂 ══════════ -->
<div class="hall" id="hall" hidden>
  <header class="hall-top">
    <button class="lnk lnk-back" id="backBtn" type="button">
      <span aria-hidden="true">←</span> 山门
    </button>
    <div class="hall-title">
      <b id="hallName">殿</b>
      <span id="hallSub">一念通佛道，指尖悟修行。</span>
    </div>
    <div class="hall-tools">
      <div class="merit" title="累计修行">
        <span id="meritName">功德</span>
        <b id="meritVal">0</b>
      </div>
      <button class="lnk" id="muteBtn" type="button" aria-pressed="false">法音 开</button>
      <button class="lnk" id="ambBtn" type="button" aria-pressed="false">禅境 关</button>
    </div>
  </header>

  <div class="hall-body">
    <nav class="rail" id="rail" aria-label="仪轨"></nav>

    <div class="stage" id="stage">

      <!-- 礼拜 -->
      <section class="panel" data-panel="bow" hidden>
        <div class="panel-head">
          <h2 class="p-title" id="bowTitle">礼佛三拜</h2>
          <p class="p-hint" id="bowHint"></p>
        </div>

        <div class="shrine">
          <div class="shrine-glow" aria-hidden="true"></div>

          <!-- 神像（动态注入所选神佛 SVG） -->
          <div class="art" id="deityArt" aria-hidden="true"></div>

          <!-- 参拜者 -->
          <div class="devotee" id="devotee" aria-hidden="true">
            <svg viewBox="0 0 140 178">
              <g class="dv">
                <!-- 蒲团 -->
                <ellipse class="dv-cushion" cx="70" cy="168" rx="44" ry="9"/>
                <!-- 海青袍（跪坐身形） -->
                <path d="M70 52c12 5 24 7 33 5 6 18 6 40 3 64-1 13-3 23-6 31H40c-3-8-5-18-6-31-3-24-3-46 3-64 9 2 21 0 33-5z"/>
                <!-- 衣领中缝 + 交领 -->
                <path class="dv-fold" d="M70 54v116 M58 62q12 9 24 0 M82 62q-12 9-24 0"/>
                <!-- 衣纹 -->
                <path class="dv-fold" d="M50 92c5 20 5 40 2 56 M90 92c-5 20-5 40-2 56"/>
                <!-- 腰带 -->
                <path class="dv-fold" d="M46 82q24 13 48 0"/>
                <!-- 头部（光顶） -->
                <ellipse cx="70" cy="34" rx="14" ry="16"/>
                <!-- 束发根（顶髻根部） -->
                <path d="M66 20 Q70 18 74 20 L72 27 Q70 28 68 27 Z"/>
                <!-- 顶髻圆球 -->
                <circle cx="70" cy="14" r="5"/>
                <!-- 面容（闭目静穆） -->
                <g class="dv-face">
                  <path d="M60 33q4 4 8 0 M72 33q4 4 8 0"/>
                  <path d="M70 37v3"/>
                  <path d="M65 43q5 3 10 0"/>
                </g>
                <!-- 合十双手 -->
                <path class="dv-hands" d="M70 52c-7 5-10 13-8 22 1 5 4 10 8 13 4-3 7-8 8-13 2-9-1-17-8-22z"/>
                <path class="dv-hands" d="M70 54v32"/>
              </g>
            </svg>
          </div>
          <div class="bow-wave" id="bowWave" aria-hidden="true"></div>
        </div>

        <div class="deity-pick" id="deityPick" role="tablist" aria-label="选择所礼神佛"></div>

        <p class="vow" id="bowVow">&nbsp;</p>

        <button class="mat" id="bowBtn" type="button">
          <svg class="mat-ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle cx="60" cy="60" r="54" class="mr-bg"/>
            <circle cx="60" cy="60" r="54" class="mr-fg" id="bowRing"/>
          </svg>
          <span class="mat-face">
            <b id="matWord">拜</b>
            <small>长按不放</small>
          </span>
        </button>

        <div class="stats">
          <div class="stat"><b id="bowSeq">0 / 3</b><span id="bowSeqLbl">本轮进度</span></div>
          <div class="stat"><b id="bowTotal">0</b><span>累计拜数</span></div>
          <div class="stat"><b id="bowRounds">0</b><span id="bowRoundLbl">礼成次数</span></div>
        </div>
      </section>

      <!-- 上香 -->
      <section class="panel" data-panel="incense" hidden>
        <div class="panel-head">
          <h2 class="p-title" id="incTitle">上香供奉</h2>
          <p class="p-hint" id="incHint"></p>
        </div>

        <div class="censer">
          <canvas id="smoke" class="smoke"></canvas>
          <div class="altar">
            <div class="offer-row" id="offerRow" aria-hidden="true"></div>
            <div class="sticks" id="sticks"></div>
            <svg class="pot" viewBox="0 0 320 130" aria-hidden="true">
              <defs>
                <linearGradient id="potG" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="var(--pot-1)"/>
                  <stop offset="1" stop-color="var(--pot-2)"/>
                </linearGradient>
              </defs>
              <path d="M46 26h228l-14 16H60z" fill="url(#potG)"/>
              <path d="M60 42h200c-6 44-22 74-38 82H98C82 116 66 86 60 42z" fill="url(#potG)"/>
              <path d="M92 124h136v8H92z" fill="url(#potG)"/>
              <g fill="none" stroke="var(--pot-line)" stroke-opacity=".55" stroke-width="1.4">
                <path d="M74 62h172M80 80h160"/>
                <circle cx="160" cy="98" r="10"/>
              </g>
            </svg>
          </div>
        </div>

        <div class="inc-tools">
          <div class="offer-pick" id="offerPick"></div>
          <div class="wish">
            <textarea id="wishText" maxlength="60" rows="2" placeholder="心中所愿，可书于此（六十字内）"></textarea>
            <button class="btn" id="wishBtn" type="button">敬 献</button>
          </div>
        </div>

        <div class="stats stats-sm">
          <div class="stat"><b id="incToday">0</b><span>今日香数</span></div>
          <div class="stat"><b id="incTotal">0</b><span>累计香数</span></div>
          <div class="stat"><b id="offerCount">0</b><span>供品</span></div>
        </div>

        <ul class="wish-list" id="wishList"></ul>
      </section>

      <!-- 木鱼 / 云磬 -->
      <section class="panel" data-panel="knock" hidden>
        <div class="panel-head">
          <h2 class="p-title" id="knTitle">敲击木鱼</h2>
          <p class="p-hint" id="knHint"></p>
        </div>

        <div class="knock-stage">
          <div class="ripples" id="ripples" aria-hidden="true"></div>
          <div class="floats" id="floats" aria-hidden="true"></div>
          <button class="knock-obj" id="knockBtn" type="button" aria-label="敲击">
            <span class="obj obj-b" aria-hidden="true">
              <svg viewBox="0 0 360 300">
                <defs>
                  <linearGradient id="wfG" x1="0" y1="0" x2=".3" y2="1">
                    <stop offset="0" stop-color="#a4682c"/>
                    <stop offset=".45" stop-color="#7c4a1d"/>
                    <stop offset="1" stop-color="#4a2a10"/>
                  </linearGradient>
                </defs>
                <ellipse cx="180" cy="262" rx="120" ry="16" fill="#000" fill-opacity=".45"/>
                <path d="M60 168c0-62 54-104 122-104s118 40 118 100c0 46-34 82-92 82H150c-56 0-90-34-90-78z" fill="url(#wfG)"/>
                <path d="M92 132c14-28 46-46 90-46s76 16 90 42c-24-16-54-24-90-24s-66 10-90 28z" fill="#c8894a" fill-opacity=".5"/>
                <path d="M118 178c26-16 58-24 88-24s54 6 74 16" fill="none" stroke="#2b1607" stroke-opacity=".65" stroke-width="7" stroke-linecap="round"/>
                <circle cx="264" cy="128" r="9" fill="#2b1607" fill-opacity=".7"/>
                <path d="M64 160c-16-6-28-20-28-34 0-16 14-26 30-22" fill="none" stroke="#7c4a1d" stroke-width="12" stroke-linecap="round"/>
                <g class="mallet" id="mallet">
                  <rect x="196" y="14" width="14" height="104" rx="7" fill="#8b5a26" transform="rotate(18 203 66)"/>
                  <ellipse cx="184" cy="126" rx="26" ry="22" fill="#a9702f"/>
                </g>
              </svg>
            </span>
            <span class="obj obj-t" aria-hidden="true">
              <svg viewBox="0 0 360 300">
                <defs>
                  <linearGradient id="qgG2" x1="0" y1="0" x2=".25" y2="1">
                    <stop offset="0" stop-color="#f0e7b4"/>
                    <stop offset=".45" stop-color="#bcae6e"/>
                    <stop offset="1" stop-color="#6b673a"/>
                  </linearGradient>
                </defs>
                <ellipse cx="180" cy="266" rx="112" ry="14" fill="#000" fill-opacity=".45"/>
                <path d="M52 96h256l-18 18H70z" fill="#4c5a55"/>
                <path d="M180 30v66" stroke="#7d8f88" stroke-width="5"/>
                <path d="M76 118h208c-10 74-52 122-104 122S86 192 76 118z" fill="url(#qgG2)"/>
                <path d="M96 132h168c-8 58-40 96-84 96s-76-38-84-96z" fill="none" stroke="#4a4726" stroke-opacity=".35" stroke-width="2"/>
                <ellipse cx="180" cy="238" rx="52" ry="10" fill="#8e8550" fill-opacity=".7"/>
                <g fill="none" stroke="#4a4726" stroke-opacity=".3" stroke-width="1.6">
                  <path d="M124 160c18 10 94 10 112 0M136 190c14 8 74 8 88 0"/>
                </g>
                <g class="mallet" id="mallet2">
                  <rect x="238" y="40" width="12" height="96" rx="6" fill="#6f5b33" transform="rotate(22 244 88)"/>
                  <circle cx="222" cy="146" r="17" fill="#c9b878"/>
                </g>
              </svg>
            </span>
          </button>
        </div>

        <div class="knock-ctrl">
          <button class="btn btn-sm" id="autoBtn" type="button" aria-pressed="false">自动敲击</button>
          <label class="slider">
            <span>快慢</span>
            <input type="range" id="tempo" min="24" max="150" step="2" value="66">
            <b id="tempoVal">66</b>
          </label>
          <button class="btn btn-sm btn-ghost" id="knReset" type="button">本次归零</button>
        </div>

        <div class="stats">
          <div class="stat"><b id="knNow">0</b><span>本次</span></div>
          <div class="stat"><b id="knTotal">0</b><span>累计</span></div>
          <div class="stat"><b id="knLeft">108</b><span id="knLeftLbl">距圆满</span></div>
          <div class="stat"><b id="knRounds">0</b><span>圆满遍数</span></div>
        </div>
      </section>

      <!-- 念珠 -->
      <section class="panel" data-panel="beads" hidden>
        <div class="panel-head">
          <h2 class="p-title" id="bdTitle">持诵佛珠</h2>
          <p class="p-hint" id="bdHint"></p>
        </div>

        <div class="beads-stage">
          <svg class="ring" id="beadRing" viewBox="0 0 440 440" role="button" tabindex="0" aria-label="拨动念珠">
            <circle cx="220" cy="220" r="164" fill="none" stroke="var(--thread)" stroke-width="1.2" stroke-opacity=".35"/>
            <g id="beadGroup"></g>
            <g id="motherBead"></g>
            <text x="220" y="196" class="ring-mantra" id="ringMantra" text-anchor="middle"></text>
            <text x="220" y="252" class="ring-num" id="ringNum" text-anchor="middle">0</text>
            <text x="220" y="284" class="ring-of" id="ringOf" text-anchor="middle">/ 108</text>
          </svg>
        </div>

        <div class="beads-ctrl">
          <button class="btn" id="beadTap" type="button">拨 一 珠</button>
          <button class="btn btn-ghost btn-sm" id="beadReset" type="button">重新起珠</button>
        </div>

        <div class="stats">
          <div class="stat"><b id="bdLaps">0</b><span id="bdLapLbl">圆满串数</span></div>
          <div class="stat"><b id="bdTotal">0</b><span>累计珠数</span></div>
          <div class="stat"><b id="bdLeft">108</b><span>本串余</span></div>
        </div>
      </section>

      <!-- 功课 -->
      <section class="panel" data-panel="course" hidden>
        <div class="panel-head">
          <h2 class="p-title" id="csTitle">今日功课</h2>
          <p class="p-hint" id="csHint">修行不在多寡，而在念念相续。</p>
        </div>

        <div class="course-grid" id="courseGrid"></div>

        <div class="course-word">
          <p class="cw-quote" id="csQuote"></p>
          <p class="cw-from" id="csFrom"></p>
        </div>

        <div class="course-act">
          <button class="btn" id="dedicateBtn" type="button">回 向</button>
          <button class="btn btn-ghost btn-sm" id="switchBtn" type="button">切换宗教</button>
          <button class="btn btn-ghost btn-sm" id="clearBtn" type="button">清 课</button>
        </div>
        <p class="course-note" id="csNote"></p>
      </section>

    </div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="scripts/store.js"></script>
<script src="scripts/audio.js"></script>
<script src="scripts/config.js"></script>
<script src="scripts/deities-buddha.js"></script>
<script src="scripts/deities-tao.js"></script>
<script src="scripts/app.js"></script>
<script src="scripts/mod-bow.js"></script>
<script src="scripts/mod-incense.js"></script>
<script src="scripts/mod-knock.js"></script>
<script src="scripts/mod-beads.js"></script>
<script src="scripts/mod-course.js"></script>
</body>
</html>
